name: Sentry branch build

on:
  push:
    branches:
      - chore/sentry-observability
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Apply non-breaking npm security fixes
        run: npm audit fix || echo 'Some advisories require major-version upgrades; continuing to the build without --force.'

      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Commit refreshed lockfile when needed
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: refresh lockfile for Sentry"
            git push
          fi
